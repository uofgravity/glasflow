name: Integration tests

on:
  push:
    branches: [ main, release* ]
  pull_request:
    branches: [ main, release* ]
  schedule:
    # Run tests at 7:00 UTC everyday
    - cron: '0 7 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})

    strategy:
      fail-fast: false
      matrix:
        os: [Ubuntu]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - {os: macOS, python-version: "3.11"}
          - {os: macOS, python-version: "3.14"}
          - {os: Windows, python-version: "3.11"}
          - {os: Windows, python-version: "3.14"}
    runs-on: ${{ matrix.os }}-latest

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v7.0.1
      with:
        submodules: recursive
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    - name: Downgrade numpy
      if: runner.os == 'Windows' && matrix.python-version == '3.11'
      run: |
        python -m pip install "numpy<2.0"
    - name: Print environment variables
      run: |
        env
    - name: Run fast integration tests with bundled nflows
      id: bundled-tests
      env:
        GLASFLOW_USE_NFLOWS: "false"
      run: python -m pytest -m "integration_test"
    - name: Run slow integration tests with bundled nflows
      env:
        GLASFLOW_USE_NFLOWS: "false"
      run: python -m pytest -m "slow_integration_test"
    - name: Install external nflows
      id: install-nflows
      if: ${{ !cancelled() && (steps.bundled-tests.outcome == 'success' || steps.bundled-tests.outcome == 'failure') }}
      run: python -m pip install nflows
    - name: Run fast integration tests with external nflows
      id: external-tests
      if: ${{ !cancelled() && steps.install-nflows.outcome == 'success' }}
      env:
        GLASFLOW_USE_NFLOWS: "true"
      run: python -m pytest -m "integration_test"
    - name: Run slow integration tests with external nflows
      if: ${{ !cancelled() && steps.external-tests.outcome == 'success' }}
      env:
        GLASFLOW_USE_NFLOWS: "true"
      run: python -m pytest -m "slow_integration_test"
