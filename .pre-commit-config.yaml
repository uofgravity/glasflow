repos:
- repo: https://github.com/psf/black
  rev: 26.10.1
  hooks:
  - id: black
    language_version: python3
- repo: https://github.com/pycqa/flake8
  rev: 7.5.0
  hooks:
    - id: flake8
      additional_dependencies:
          - Flake8-pyproject==1.2.4
- repo: https://github.com/kynan/nbstripout
  rev: 0.9.1
  hooks:
    - id: nbstripout
